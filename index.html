<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Captcha Game</title>
    <link rel="stylesheet" href="style.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="captcha-container">
        <div class="app-header-top">
            <h2>Kliknutím otočte každou dlaždici, dokud nevznikne správná mapa.</h2>
            <button id="leaderboard-btn" class="icon-btn" title="Žebříček Top 10">🏆</button>
        </div>
        
        <div class="header" style="margin-bottom: 16px;">
            <div class="controls-bar">
                <div class="game-settings">
                    <div class="stats-group">
                        <div class="time-block" style="display: flex; flex-direction: column; line-height: 1.2;">
                            <span class="score-display timer-display" style="font-size: 15px;" title="Čas">⏱️ <span id="timer-val">0.00</span>s</span>
                            <span class="pb-text" style="color: var(--text-secondary); font-weight: 600;">👑 PB: <span id="pb-val">--</span>s</span>
                        </div>
                        <span class="score-display" title="Zbývající Pokusy">❤️ <span id="lives-val">3</span></span>
                        <span class="score-display" title="Série správných odpovědí">🔥 <span id="streak-val">0</span></span>
                        <span class="score-display" title="Nasbírané Globální Skóre">⭐ <span id="score-val">0</span></span>
                    </div>
                    <select id="difficulty-select">
                        <option value="3">3x3 (Lehká)</option>
                        <option value="4">4x4 (Střední)</option>
                        <option value="5">5x5 (Těžká)</option>
                    </select>
                </div>
            </div>
        </div>
        
        <div class="grid" id="captcha-grid">
            <!-- Tiles generated by JS -->
        </div>

        <div class="footer">
            <button id="done-btn">Hotovo</button>
        </div>
    </div>
    
    <div id="success-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Úspěch!</h2>
            <p>Jste člověk.</p>
            <p id="final-time" style="font-weight: bold; margin-bottom: 8px; color: #fb923c;"></p>
            <p id="earned-points" style="font-weight: bold; margin-bottom: 8px; color: #4ade80;"></p>
            <p id="city-reveal" style="font-size: 13px; color: var(--text-secondary); margin-bottom: 20px;"></p>
            
            <div id="leaderboard-submit-form" style="margin-bottom: 24px;">
                <label for="player-name-input" style="display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 8px;">Uložit skóre do žebříčku:</label>
                <div style="display: flex; gap: 8px; justify-content: center;">
                    <input type="text" id="player-name-input" placeholder="Zadejte přezdívku..." maxlength="15" autocomplete="off" />
                    <button id="submit-score-btn" class="secondary-btn" style="padding: 10px 16px;">Uložit</button>
                </div>
                <p id="submit-message" style="font-size: 12px; color: #4ade80; margin-top: 8px; display: none; margin-bottom:0;">Skóre bylo uloženo!</p>
            </div>

            <button id="restart-btn">Hrát znovu</button>
        </div>
    </div>
    
    <div class="site-footer">
        &copy; 2026 Michal Strachota | Map data &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" style="color: inherit; text-decoration: underline;">OpenStreetMap contributors</a>
    </div>

    <!-- Leaderboard Modal -->
    <div id="leaderboard-modal" class="modal hidden">
        <div class="modal-content" style="max-width: 500px; width: 100%; max-height: 80vh; display: flex; flex-direction: column;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h2 style="margin: 0;">🏆 Top 10 Hráčů</h2>
                <button id="close-leaderboard" class="secondary-btn">Zavřít</button>
            </div>
            
            <div id="lb-tabs" style="display: flex; gap: 8px; margin-bottom: 16px;">
                <button class="tab-btn active" data-size="3">3x3 (Lehká)</button>
                <button class="tab-btn" data-size="4">4x4 (Střední)</button>
                <button class="tab-btn" data-size="5">5x5 (Těžká)</button>
            </div>

            <div id="leaderboard-list" style="overflow-y: auto; text-align: left; padding-right: 10px;">
                Načítání...
            </div>
        </div>
    </div>

    <script src="script.js?v=3"></script>

    <!-- Cloudflare Web Analytics -->
    <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "b59718b6590e4d3fbc91dbb694739aba"}'></script>
    <!-- End Cloudflare Web Analytics -->
</body>
</html>
