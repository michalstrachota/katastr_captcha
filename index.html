<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captcha Game</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="captcha-container">
        <div class="header">
            <h2>Kliknutím otočte každou dlaždici tak, aby tvořily mapu. Po dokončení klikněte na tlačítko Hotovo.</h2>
            <div class="controls-bar">
                <span class="captcha-id" id="captcha-id-text">a715e6e17f7c2dba</span>
                <div class="game-settings">
                    <span class="score-display">Skóre: <span id="score-val">0</span></span>
                    <select id="difficulty-select">
                        <option value="3">3x3 (Lehká)</option>
                        <option value="4">4x4 (Střední)</option>
                        <option value="5">5x5 (Těžká)</option>
                    </select>
                </div>
            </div>
        </div>
        
        <div class="grid" id="captcha-grid">
            <!-- Tiles generated by JS -->
        </div>

        <div class="footer">
            <button id="done-btn">Hotovo</button>
        </div>
    </div>
    
    <div id="success-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Úspěch!</h2>
            <p>Jste člověk.</p>
            <button id="restart-btn">Hrát znovu</button>
        </div>
    </div>
    
    <div class="site-footer">
        &copy; 2026 Michal Strachota | Map data &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" style="color: inherit; text-decoration: underline;">OpenStreetMap contributors</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
